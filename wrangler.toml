# Pages config for commands run from the repository root:
#   npx wrangler pages dev
#   npx wrangler pages deploy
#
# Git deploys on Cloudflare Pages should set the project root directory to
# `production` (see README). That mode does not read this file, so the SIGNUPS
# binding also has to be added in the dashboard. There are no environment variables.

name = "tworlabs"
pages_build_output_dir = "./production"
compatibility_date = "2026-11-10"

# Create the namespace, then replace the id:
#   npx wrangler kv namespace create SIGNUPS
[[kv_namespaces]]
binding = "SIGNUPS"
id = "0b522ad5f19244a6b5e3fcd58425440f"

# Scores + photos for the Wall of Fame (see production/functions/api/).
[[kv_namespaces]]
binding = "tworlabs_wall"
id = "575da04e83114c6e80fc3c72ed0f091d"
