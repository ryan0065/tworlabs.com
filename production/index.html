      </svg>

      <picture>
        <source srcset="/assets/logo.webp" type="image/webp">
        <img class="logo" src="/assets/logo.png" width="807" height="1000" alt="TwoRLabs logo: two pixel brothers on a shield, one holding a potion and one holding a wrench, above a banner that reads TwoRLabs." fetchpriority="high" decoding="async">
      </picture>

    <p class="tagline">Two brothers. Big ideas. Building a new world.</p>

    <form id="notify" class="notify" action="/api/subscribe" method="post">
      <div class="hp" aria-hidden="true">
        <label for="fax_number">Fax number</label>
        <input id="fax_number" name="fax_number" type="text" tabindex="-1" autocomplete="off" value="">
      </div>
      <div class="signup-row">
        <button type="submit">Get Notified</button>
        <label class="sr-only" for="email">Your email</label>
        <input id="email" name="email" class="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email" maxlength="254" required spellcheck="false" aria-describedby="form-status">
      </div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="fineprint">We'll only use your email to tell you when we launch.</p>
