<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects — TwoRLabs</title>
  <meta name="description" content="Projects from TwoRLabs: games to play, and a studio to make things in.">
  <link rel="canonical" href="https://tworlabs.com/projects/">
  <meta name="theme-color" content="#02205A">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TwoRLabs">
  <meta property="og:url" content="https://tworlabs.com/projects/">
  <meta property="og:title" content="Projects — TwoRLabs">
  <meta property="og:description" content="Games to play, and a studio to make things in.">
  <meta property="og:image" content="https://tworlabs.com/assets/og.jpg">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="scenery" aria-hidden="true">
    <div class="stars"></div>
    <div class="stars stars-lg"></div>
    <span class="spark s1"></span>
    <span class="spark s2"></span>
    <span class="spark s3 gold"></span>
    <span class="spark s4"></span>
    <span class="spark s5 gold"></span>
    <span class="spark s6"></span>
    <span class="spark s7"></span>
    <span class="spark s8 gold"></span>
    <img class="cloud k1" src="/assets/cloud.png" alt="" width="160" height="60">
    <img class="cloud k2" src="/assets/cloud-b.png" alt="" width="130" height="50">
    <img class="cloud k3" src="/assets/cloud.png" alt="" width="160" height="60">
    <img class="cloud k4" src="/assets/cloud-b.png" alt="" width="130" height="50">
    <img class="cloud k5" src="/assets/cloud.png" alt="" width="160" height="60">
    <img class="tree ta" src="/assets/tree-c.png" alt="" width="180" height="140">
    <img class="tree tb" src="/assets/tree-a.png" alt="" width="160" height="110">
    <img class="rock ra" src="/assets/rock.png" alt="" width="60" height="40">
    <img class="tree tc" src="/assets/tree-c.png" alt="" width="180" height="140">
    <img class="tree td" src="/assets/tree-b.png" alt="" width="120" height="90">
    <img class="rock rb" src="/assets/rock.png" alt="" width="60" height="40">
  </div>

  <main id="main">
    <h1 class="pixel-title lab-title">Projects</h1>
    <p class="tagline">Games to play, and a studio to make things in.</p>
    <p><a class="button" href="/">Back home</a> <a class="button" href="#feedback" id="feedback-open">💬 Feedback</a></p>

    <section class="project-section" aria-labelledby="projects-games-heading">
      <h2 id="projects-games-heading" class="project-section-title">Games</h2>
      <div id="projects-games" class="project-grid">
        <p class="lab-loading">Loading projects…</p>
      </div>
    </section>

    <section class="project-section" aria-labelledby="projects-studio-heading">
      <h2 id="projects-studio-heading" class="project-section-title">Build Studio</h2>
      <div id="projects-studio" class="project-grid">
        <p class="lab-loading">Loading projects…</p>
      </div>
    </section>

    <section id="feedback" class="project-section" aria-labelledby="feedback-heading">
      <h2 id="feedback-heading" class="project-section-title">Feedback</h2>
      <p>Got a comment or a suggestion for the TwoRLabs team? Send it here — it goes straight to the team and isn't posted anywhere public.</p>
      <form id="feedback-form" class="feedback-form" action="/api/feedback" method="post">
        <div class="hp" aria-hidden="true">
          <label for="feedback-fax">Fax number</label>
          <input id="feedback-fax" name="fax_number" type="text" tabindex="-1" autocomplete="off" value="">
        </div>
        <p>
          <label for="feedback-name">Your name (optional)</label>
          <input id="feedback-name" name="name" type="text" maxlength="80" autocomplete="name" placeholder="Your name">
        </p>
        <p>
          <label for="feedback-project">Which project is this about?</label>
          <select id="feedback-project" name="project">
            <option>General</option>
            <option>Ridge World</option>
            <option>Dad's Pool Game</option>
            <option>Photo Studio</option>
            <option>TwoRLabs Interactive World</option>
            <option>Lobby Game</option>
            <option>Moses — Escape from Egypt</option>
          </select>
        </p>
        <p>
          <label for="feedback-message">Your comment or suggestion</label>
          <textarea id="feedback-message" name="message" rows="5" maxlength="2000" required placeholder="Tell us what you think, or what we should build next…"></textarea>
        </p>
        <p><button class="button" type="submit">Send feedback</button></p>
        <p id="feedback-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <noscript>
      <section class="project-section">
        <h2 class="project-section-title">Games</h2>
        <div class="project-grid">
          <article class="project-card">
            <a href="/games/ridge-world/v14/"><img class="project-shot" src="/assets/projects/ridge-world.png" alt="Ridge World" width="200" height="125"></a>
            <h3 class="project-title">Ridge World <span class="project-version">v14</span></h3>
            <p class="project-meta">Rhett · Nov 14, 2026</p>
            <p>New Easter egg added.</p>
            <p><a class="button" href="/games/ridge-world/v14/">Play</a></p>
          </article>
          <article class="project-card">
            <a href="/games/dads-pool-game/v8/"><img class="project-shot" src="/assets/projects/dads-pool-game.png" alt="Dad's Pool Game" width="200" height="125"></a>
            <h3 class="project-title">Dad's Pool Game <span class="project-version">v8</span></h3>
            <p class="project-meta">Dad · Nov 17, 2026</p>
            <p>The shark escape is easier now — the whirlpool charges faster and the shark gives Dad more time before it strikes. — dodge and push it around until a whirlpool forms and washes it away. 1000 survivor points.</p>
            <p><a class="button" href="/games/dads-pool-game/v8/">Play</a></p>
          </article>
          <article class="project-card">
            <a href="/games/tworlabs-interactive-world/v2/"><img class="project-shot" src="/assets/projects/tworlabs-interactive-world.png" alt="TwoRLabs Interactive World" width="200" height="125"></a>
            <h3 class="project-title">TwoRLabs Interactive World <span class="project-version">v2</span></h3>
            <p class="project-meta">Dad · Nov 14, 2026</p>
            <p>Pinch-to-zoom turned off so holding the joystick with one hand and tapping the game pads and buttons with the other no longer zooms the page on iPhone and iPad.</p>
            <p><a class="button" href="/games/tworlabs-interactive-world/v2/">Play</a></p>
          </article>
          <article class="project-card">
            <a href="/games/loading-screen-and-lobby/v2/"><img class="project-shot" src="/assets/projects/loading-screen-and-lobby.png" alt="Lobby Game" width="200" height="125"></a>
            <h3 class="project-title">Lobby Game <span class="project-version">v2</span></h3>
            <p class="project-meta">Dad · Nov 14, 2026</p>
            <p>Pinch-to-zoom turned off so tapping the joystick, jump button, and game pads no longer zooms the page on iPhone and iPad.</p>
            <p><a class="button" href="/games/loading-screen-and-lobby/v2/">Play</a></p>
          </article>
          <article class="project-card">
            <a href="/games/moses-escape-from-egypt/v1/"><img class="project-shot" src="/assets/projects/moses-escape-from-egypt.png" alt="Moses — Escape from Egypt" width="200" height="125"></a>
            <h3 class="project-title">Moses — Escape from Egypt <span class="project-version">v1</span></h3>
            <p class="project-meta">Dad · Nov 13, 2026</p>
            <p>Play all 22 scenes from the birth of Moses to the crossing of the Red Sea.</p>
            <p><a class="button" href="/games/moses-escape-from-egypt/v1/">Play</a></p>
          </article>
        </div>
      </section>
      <section class="project-section">
        <h2 class="project-section-title">Build Studio</h2>
        <div class="project-grid">
          <article class="project-card">
            <a href="/games/photo-edit-game/v5/"><img class="project-shot" src="/assets/projects/photo-edit-game.png" alt="Photo Studio" width="200" height="125"></a>
            <h3 class="project-title">Photo Studio <span class="project-version">v5</span></h3>
            <p class="project-meta">Ridge · Nov 16, 2026</p>
            <p>New gaming props — a TV, VR headset, two controllers, and a Room tab to build the scene around them.</p>
            <p><a class="button" href="/games/photo-edit-game/v5/">Play</a></p>
          </article>
        </div>
      </section>
    </noscript>
  </main>

  <div class="ground" aria-hidden="true"></div>
  <script src="/js/projects.js?v=3" defer></script>
</body>
</html>
