<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/gtag.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LCYP2G9H7J"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit an Idea — TwoRLabs</title>
  <meta name="description" content="Got an idea for TwoRLabs? Tell Ridge and Rhett — they read every idea and see what they can build.">
  <link rel="canonical" href="https://tworlabs.com/submit-ideas/">
  <meta name="theme-color" content="#02205A">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TwoRLabs">
  <meta property="og:url" content="https://tworlabs.com/submit-ideas/">
  <meta property="og:title" content="Submit an Idea — TwoRLabs">
  <meta property="og:description" content="Got an idea for TwoRLabs? Tell Ridge and Rhett — they read every idea and see what they can build.">
  <meta property="og:image" content="https://tworlabs.com/assets/og.jpg">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css?v=8">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div class="scenery" aria-hidden="true">
    <div class="stars"></div>
    <div class="stars stars-lg"></div>
    <span class="spark s1"></span>
    <span class="spark s2"></span>
    <span class="spark s3 gold"></span>
    <span class="spark s4"></span>
    <span class="spark s5 gold"></span>
    <span class="spark s6"></span>
    <span class="spark s7"></span>
    <span class="spark s8 gold"></span>
    <img class="cloud k1" src="/assets/cloud.png" alt="" width="160" height="60">
    <img class="cloud k2" src="/assets/cloud-b.png" alt="" width="130" height="50">
    <img class="cloud k3" src="/assets/cloud.png" alt="" width="160" height="60">
    <img class="cloud k4" src="/assets/cloud-b.png" alt="" width="130" height="50">
    <img class="cloud k5" src="/assets/cloud.png" alt="" width="160" height="60">
    <img class="tree ta" src="/assets/tree-c.png" alt="" width="180" height="140">
    <img class="tree tb" src="/assets/tree-a.png" alt="" width="160" height="110">
    <img class="rock ra" src="/assets/rock.png" alt="" width="60" height="40">
    <img class="tree tc" src="/assets/tree-c.png" alt="" width="180" height="140">
    <img class="tree td" src="/assets/tree-b.png" alt="" width="120" height="90">
    <img class="rock rb" src="/assets/rock.png" alt="" width="60" height="40">
  </div>

  <main id="main">
    <h1 class="pixel-title lab-title">Submit an Idea</h1>
    <p class="tagline">Got an idea for a game, or something new for TwoRLabs?</p>
    <p>Ridge and Rhett read every idea and see what they can build.</p>
    <p><a class="button" href="/">Back home</a></p>

    <form id="idea-form" class="feedback-form" action="/api/ideas" method="post">
      <div class="hp" aria-hidden="true">
        <label for="idea-fax">Fax number</label>
        <input id="idea-fax" name="fax_number" type="text" tabindex="-1" autocomplete="off" value="">
      </div>
      <p>
        <label for="idea-name">Your name</label>
        <input id="idea-name" name="name" type="text" maxlength="80" autocomplete="name" placeholder="Your name" required>
      </p>
      <p>
        <label for="idea-email">Email address</label>
        <input id="idea-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
      </p>
      <p>
        <label for="idea-idea">Give us your idea.</label>
        <textarea id="idea-idea" name="idea" rows="6" maxlength="2000" required placeholder="What should the boys build next?"></textarea>
      </p>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAGHo_EH_q0bSOaSC"></div>
      <p><button class="button" type="submit">Send my idea</button></p>
      <p id="idea-status" class="status" role="status" aria-live="polite"></p>
    </form>
    <noscript>
      <p>This form needs JavaScript to check the captcha and send your idea. Please turn JavaScript on and try again.</p>
    </noscript>
  </main>

  <div class="ground" aria-hidden="true"></div>
  <script src="/js/submit-ideas.js" defer></script>
</body>
</html>
